name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install opencv-contrib-python-headless numpy pillow

      - name: Unit tests
        # The suite is stubbed end to end: no camera, no model weights, no
        # display, so it runs identically on all three runners.
        run: python -m unittest discover -s tests -v

      - name: Import every module
        run: |
          python -c "import autolock, autolock.cli, autolock.presence, autolock.safety, autolock.autostart, autolock.lock, autolock.camera, autolock.identity, autolock.ui; print('imports ok')"

      - name: CLI smoke
        run: |
          python main.py --version
          python main.py config
          python main.py autostart --status

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
